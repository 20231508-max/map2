<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>거리 측정 도구 (핀치 줌 지원)</title>
    <style>
        body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        #wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            background-color: #444; 
            touch-action: none; 
            border: 1px solid #666;
            image-rendering: high-quality;
            transform-origin: center; /* 확대 축소 기준점 */
        }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; z-index: 10; font-family: sans-serif; pointer-events: none; font-size: 13px; }
    </style>
</head>
<body>
    <div id="info">한 손가락: 측정 / 두 손가락: 확대 및 이동</div>
    <div id="wrapper">
        <canvas id="mapCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        const img = new Image();

        img.src = 'map_image2.png';

        let isDrawing = false;
        let startX, startY;
        let scaleFactor = 1; // 이미지 대비 캔버스 비율
        
        // 줌 및 이동 관련 변수
        let zoomScale = 1;
        let lastZoomScale = 1;
        let offsetX = 0, offsetY = 0;
        let lastTouchDist = 0;

        img.onload = initCanvas;
        window.addEventListener('resize', initCanvas);

        function initCanvas() {
            const padding = 20;
            const winW = window.innerWidth - padding;
            const winH = window.innerHeight - padding;
            
            if (img.complete && img.width > 0) {
                const ratio = Math.min(winW / img.width, winH / img.height);
                canvas.width = img.width * ratio;
                canvas.height = img.height * ratio;
                scaleFactor = ratio;
                updateCanvasTransform();
            }
            render();
        }

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${zoomScale})`;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            if (img.complete && img.width > 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
        }

        function getDistanceText(px) {
            const originalPx = px / scaleFactor;
            const meters = Math.floor(originalPx * 1.368); // 320m -> 426m 비율
            if (meters < 1000) return `${meters} m`;
            return `${Math.floor(meters / 1000)} km ${meters % 1000} m`;
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // 확대된 상태에서의 좌표 보정
            return {
                x: (clientX - rect.left) / zoomScale,
                y: (clientY - rect.top) / zoomScale
            };
        }

        // 터치 이벤트 핸들러
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDrawing = true;
                const pos = getEventPos(e);
                startX = pos.x; startY = pos.y;
            } else if (e.touches.length === 2) {
                isDrawing = false; // 두 손가락일 땐 측정 중단
                lastTouchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDrawing) {
                if (e.cancelable) e.preventDefault();
                const pos = getEventPos(e);
                render();
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#FFDC00';
                ctx.lineWidth = 5 / zoomScale; // 줌 상태에 따라 선 두께 유지
                ctx.lineCap = 'round';
                ctx.stroke();

                const dist = Math.sqrt((pos.x - startX)**2 + (pos.y - startY)**2);
                const distText = getDistanceText(dist);
                const fontSize = Math.max(18, canvas.width / 30) / zoomScale; 
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.strokeStyle = 'black'; ctx.lineWidth = 3 / zoomScale;
                ctx.strokeText(distText, pos.x + 10/zoomScale, pos.y - 10/zoomScale);
                ctx.fillStyle = 'white'; ctx.fillText(distText, pos.x + 10/zoomScale, pos.y - 10/zoomScale);
            } else if (e.touches.length === 2) {
                // 핀치 줌 로직
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const delta = dist / lastTouchDist;
                zoomScale = Math.min(Math.max(1, lastZoomScale * delta), 5); // 1배~5배 제한
                updateCanvasTransform();
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                lastZoomScale = zoomScale;
            }
            isDrawing = false;
        });

        // 마우스 이벤트 (PC용)
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getEventPos(e);
            startX = pos.x; startY = pos.y;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getEventPos(e);
            render();
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#FFDC00';
            ctx.lineWidth = 5 / zoomScale;
            ctx.stroke();
            const distText = getDistanceText(Math.sqrt((pos.x - startX)**2 + (pos.y - startY)**2));
            const fontSize = Math.max(18, canvas.width / 30) / zoomScale;
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.strokeText(distText, pos.x + 10/zoomScale, pos.y - 10/zoomScale);
            ctx.fillStyle = 'white'; ctx.fillText(distText, pos.x + 10/zoomScale, pos.y - 10/zoomScale);
        });
        window.addEventListener('mouseup', () => isDrawing = false);
    </script>
</body>
</html>
