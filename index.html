<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>거리 측정 도구 (비율 최종 수정)</title>
    <style>
        body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            background-color: #444; 
            touch-action: none; 
            border: 1px solid #666;
            image-rendering: high-quality;
        }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; z-index: 10; font-family: sans-serif; pointer-events: none; font-size: 13px; }
    </style>
</head>
<body>
    <div id="info">지도 로드 중...</div>
    <canvas id="mapCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        const img = new Image();

        // 이미지 파일명 확인 필수!
        img.src = 'map_image2.png';

        let isDrawing = false;
        let startX, startY;
        let scaleFactor = 1;

        function initCanvas() {
            const padding = 20;
            const winW = window.innerWidth - padding;
            const winH = window.innerHeight - padding;
            
            if (img.complete && img.width > 0) {
                const ratio = Math.min(winW / img.width, winH / img.height);
                canvas.width = img.width * ratio;
                canvas.height = img.height * ratio;
                scaleFactor = ratio;
                info.innerHTML = "지도 로드 완료!";
            } else {
                canvas.width = winW;
                canvas.height = winH;
                scaleFactor = 1;
                info.innerHTML = "이미지를 불러올 수 없습니다.";
            }
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            if (img.complete && img.width > 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
        }

        function getDistanceText(px) {
            const originalPx = px / scaleFactor;
            // 320m 측정값이 426m가 되도록 보정된 계수 (1.368)
            const meters = Math.floor(originalPx * 1.368); 
            if (meters < 1000) return `${meters} m`;
            return `${Math.floor(meters / 1000)} km ${meters % 1000} m`;
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        const startAction = (e) => { isDrawing = true; const pos = getEventPos(e); startX = pos.x; startY = pos.y; };
        const moveAction = (e) => {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getEventPos(e);
            render();
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#FFDC00';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.stroke();

            const distText = getDistanceText(Math.sqrt((pos.x - startX)**2 + (pos.y - startY)**2));
            const fontSize = Math.max(18, canvas.width / 30); 
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
            ctx.strokeText(distText, pos.x + 10, pos.y - 10);
            ctx.fillStyle = 'white'; ctx.fillText(distText, pos.x + 10, pos.y - 10);
        };
        const endAction = () => { isDrawing = false; };

        img.onload = initCanvas;
        img.onerror = initCanvas;
        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);
        canvas.addEventListener('mousedown', startAction);
        window.addEventListener('mousemove', moveAction);
        window.addEventListener('mouseup', endAction);
        canvas.addEventListener('touchstart', startAction, {passive: false});
        window.addEventListener('touchmove', moveAction, {passive: false});
        window.addEventListener('touchend', endAction);
    </script>
</body>
</html>
